name: Lab 8 CI Pipeline

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

jobs:
  validate-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Project Files
        run: |
          test -f config.yaml
          test -f data/raw/churn.csv
          test -f src/mlops_pipeline/churn_prediction_pipeline.py
          test -f src/mlops_pipeline/10_failure_injection.py

      - name: Run Failure Handling Checks
        run: |
          python src/mlops_pipeline/10_failure_injection.py