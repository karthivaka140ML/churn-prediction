data:
  raw_path: "data/raw/churn.csv"
  processed_dir: "data/processed"
  target_column: "Churn"
  id_column: "customerID"

split:
  test_size: 0.2
  random_state: 42

paths:
  preprocessor: "models/preprocessor.pkl"
  model: "models/random_forest_model.pkl"
  evaluation_report: "reports/model_evaluation.json"
  quality_gate_report: "reports/quality_gate_report.json"
  inference_output: "reports/inference_results.csv"
  
mlflow:
  tracking_uri: "sqlite:///mlflow.db"
  experiment_name: "Telco_Churn_Prediction"

model:
  n_estimators: 200
  max_depth: 15
  random_state: 42
  class_weight: "balanced"

registry:
  model_name: "Telco_Churn_Production_Model"
  decision_metric: "recall"

quality_gate:
  metric: "f1_score"
  minimum_value: 0.60